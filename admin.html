<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex">
<title>پنل مدیریت | ارتودنسی عبدی</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css"></head><body>
<div id="lg" class="login"><img src="assets/logo.png" alt=""><h2>ورود مدیریت</h2><br>
<input id="em" type="email" placeholder="ایمیل مدیر" dir="ltr" autofocus><br><br><input id="pw" type="password" placeholder="رمز عبور" dir="ltr"><br><br><button class="btn" onclick="login()">ورود</button><p id="er" style="color:var(--bad)"></p></div>
<div id="app" hidden>
<div class="top"><div class="w"><div style="display:flex;align-items:center"><img src="assets/logo.png" alt=""><b>پنل مدیریت</b></div>
<div><a href="index.html" style="margin-left:16px">مشاهده سایت</a><a href="#" onclick="sb.auth.signOut().then(()=>location.reload())">خروج</a></div></div></div>
<div class="w"><div class="tabs"><button id="t1" class="on" onclick="tab(1)">درخواست‌های نوبت</button><button id="t2" onclick="tab(2)">پرونده بیماران</button></div>
<div id="p1" class="tw"></div>
<div id="p2" hidden><div class="pl"><div><div class="card" style="margin-bottom:12px"><input id="sq" placeholder="جستجوی بیمار" oninput="list()"><br><br><input id="npn" placeholder="نام بیمار جدید"><br><br><input id="npp" placeholder="شماره تماس" inputmode="tel"><br><br><button class="btn s" onclick="newP()">+ افزودن بیمار</button></div><button class="btn o s" style="width:100%;margin-bottom:12px" onclick="exportX()">⬇ خروجی Excel همه پرونده‌ها</button><div class="li" id="pl"></div></div><div id="pd"><p class="sub">یک بیمار را انتخاب کنید یا بیمار جدید بسازید.</p></div></div></div>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="assets/config.js"></script>
<script src="assets/app.js"></script>
<script>
const $=id=>document.getElementById(id);let cur=null,P=[];
async function login(){if(!sb)return;const{error}=await sb.auth.signInWithPassword({email:$('em').value.trim(),password:$('pw').value});if(error)$('er').textContent='ایمیل یا رمز اشتباه است';else start()}
$('pw').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
function start(){$('lg').hidden=true;$('app').hidden=false;reqs();loadP()}
(async()=>{if(!sb){$('er').textContent='اطلاعات Supabase در assets/config.js وارد نشده است';return}const{data}=await sb.auth.getSession();if(data.session)start()})();
function tab(n){$('p1').hidden=n!=1;$('p2').hidden=n!=2;$('t1').className=n==1?'on':'';$('t2').className=n==2?'on':''}
function cf(m,fn){const o=document.createElement('div');o.style.cssText='position:fixed;inset:0;background:#0b254588;display:grid;place-items:center;z-index:99';o.innerHTML=`<div class="card" style="text-align:center"><p>${m}</p><br><button class="btn d">بله، حذف شود</button> <button class="btn o">انصراف</button></div>`;const b=o.querySelectorAll('button');b[0].onclick=()=>{o.remove();fn()};b[1].onclick=()=>o.remove();document.body.append(o)}
// requests
async function reqs(){const{data:r}=await sb.from('requests').select('*').order('date_j');
$('p1').innerHTML=r&&r.length?`<table><tr><th>تاریخ درخواستی</th><th>زمان</th><th>نام</th><th>تلفن</th><th>نوع</th><th>توضیحات</th><th>وضعیت</th><th></th></tr>${r.map(x=>`<tr><td>${fa(x.date_j)}</td><td>${esc(x.time)}</td><td>${esc(x.name)}</td><td>${fa(esc(x.phone))}</td><td>${esc(x.type)}</td><td>${esc(x.note)}</td><td><span class="tag ${x.status=='تأیید شد'?'ok':x.status=='رد شد'?'no':''}">${x.status}</span></td><td style="white-space:nowrap"><button class="btn s" onclick="st(${x.id},'تأیید شد')">تأیید</button> <button class="btn s o" onclick="st(${x.id},'رد شد')">رد</button> <button class="btn s d" onclick="rm(${x.id})">حذف</button></td></tr>`).join('')}</table>`:'<p class="sub">هنوز درخواستی ثبت نشده است.</p>'}
const st=async(id,s)=>{await sb.from('requests').update({status:s}).eq('id',id);reqs()};
const rm=id=>cf('این درخواست حذف شود؟',async()=>{await sb.from('requests').delete().eq('id',id);reqs()});
// patients
async function loadP(){const{data}=await sb.from('patients').select('*').order('created_at',{ascending:false});P=data||[];list()}
function list(){const q=dg($('sq').value.trim()),p=P.filter(x=>x.name.includes(q)||dg(x.phone||'').includes(q)||String(x.file_no).includes(q));
$('pl').innerHTML=p.map(x=>`<div class="${x.id==cur?'on':''}" onclick="show(${x.id})">${esc(x.name)}<br><small>پرونده ${fa(x.file_no)} · ${fa(esc(x.phone))}</small></div>`).join('')||'<div>بیماری ثبت نشده</div>'}
async function newP(){const name=$('npn').value.trim(),phone=dg($('npp').value.trim());if(!name){$('npn').focus();return}
const{data,error}=await sb.from('patients').insert({name,phone}).select().single();if(error)return alert('ثبت نشد؛ فایل supabase-setup.sql را اجرا کرده‌اید؟');$('npn').value=$('npp').value='';await loadP();show(data.id)}
const num=(v,k)=>`<input class="ci m ${k}" inputmode="numeric" dir="ltr" value="${fa(v||0)}">`;
async function show(id){cur=id;list();const p=P.find(x=>x.id==id);
const{data:v}=await sb.from('visits').select('*').eq('patient_id',id).order('date_j').order('id');const V=v||[];
const sp=V.reduce((s,x)=>s+ +x.paid,0),sd=V.reduce((s,x)=>s+ +x.debt,0);
$('pd').innerHTML=`<h2>${esc(p.name)}</h2><span class="tag ok">پرونده شماره ${fa(p.file_no)}</span>
<div class="row" style="margin-top:12px"><input value="${esc(p.name)}" placeholder="نام" onchange="savP('name',this.value)"><input value="${esc(p.phone)}" dir="ltr" placeholder="شماره تماس" onchange="savP('phone',dg(this.value))"></div>
<label>اطلاعات و سابقه پزشکی</label><textarea rows="2" onchange="savP('notes',this.value)">${esc(p.notes)}</textarea>
<h3 style="margin:20px 0 4px;color:var(--n)">جدول پرونده (همه خانه‌ها قابل ویرایش است)</h3>
<div class="tw"><table class="rt"><thead><tr><th>ردیف</th><th>تاریخ</th><th>اقدام انجام شده</th><th>واریزی</th><th>بدهی</th><th></th></tr></thead><tbody>
${V.map((x,i)=>`<tr data-id="${x.id}"><td><span class="rn">${fa(i+1)}</span></td><td><input class="ci" dir="ltr" value="${fa(esc(x.date_j))}" onchange="sv(${x.id},'date_j',this)"></td><td><input class="ci" style="min-width:180px" value="${esc(x.descr)}" onchange="sv(${x.id},'descr',this)"></td><td>${num(x.paid,'ok').replace('<input','<input onchange="sv('+x.id+`,'paid',this)"`)}</td><td>${num(x.debt,'bad').replace('<input','<input onchange="sv('+x.id+`,'debt',this)"`)}</td><td><button class="btn s d" onclick="delRow(${x.id})">حذف</button></td></tr>`).join('')}
</tbody><tfoot><tr><td colspan="3">جمع</td><td>${money(sp)}</td><td>${money(sd)}</td><td></td></tr></tfoot></table></div>
<button class="btn s" onclick="addRow()">+ ردیف جدید</button>
<div class="nx"><h3>نوبت مراجعه بعدی</h3><div class="row"><div id="nd"></div><input id="nt2" type="time" dir="ltr"></div>
<button class="btn s" onclick="saveNx()">ذخیره نوبت</button> <button class="btn s o" onclick="clrNx()">پاک کردن نوبت</button>
<p style="margin-top:8px;color:var(--mut)">ثبت‌شده: ${p.next_date?fa(p.next_date)+' ساعت '+fa(p.next_time||''):'—'}</p></div>
<br><button class="btn s d" onclick="delP()">حذف کل پرونده</button>`;
window.gn=jpicker($('nd'));if(p.next_date){gn.set(p.next_date);$('nt2').value=p.next_time||''}}
async function savP(k,v){await sb.from('patients').update({[k]:v}).eq('id',cur);P.find(x=>x.id==cur)[k]=v;if(k!='notes'){list();if(k=='name')show(cur)}}
async function sv(id,f,el){const num=f=='paid'||f=='debt',v=num?en(el.value):dg(el.value).replace(/-/g,'/');await sb.from('visits').update({[f]:v}).eq('id',id);if(num)show(cur)}
async function addRow(){const t=jtoday();await sb.from('visits').insert({patient_id:cur,date_j:jstr(t.y,t.m,t.d),descr:'',paid:0,debt:0});show(cur)}
const delRow=id=>cf('این ردیف حذف شود؟',async()=>{await sb.from('visits').delete().eq('id',id);show(cur)});
async function saveNx(){const d=gn(),t=$('nt2').value;await sb.from('patients').update({next_date:d,next_time:t}).eq('id',cur);Object.assign(P.find(x=>x.id==cur),{next_date:d,next_time:t});show(cur)}
async function clrNx(){await sb.from('patients').update({next_date:null,next_time:null}).eq('id',cur);Object.assign(P.find(x=>x.id==cur),{next_date:null,next_time:null});show(cur)}
const delP=()=>cf('کل پرونده حذف شود؟',async()=>{await sb.from('patients').delete().eq('id',cur);cur=null;$('pd').innerHTML='';loadP()});
async function exportX(){const[{data:ps},{data:vs}]=await Promise.all([sb.from('patients').select('*').order('file_no'),sb.from('visits').select('*').order('date_j').order('id')]);
const rows=[];(ps||[]).forEach(p=>{const nx=p.next_date?p.next_date+' '+(p.next_time||''):'',base={'شماره پرونده':p.file_no,'نام':p.name,'تلفن':p.phone,'نوبت بعدی':nx},mine=(vs||[]).filter(v=>v.patient_id==p.id);
if(!mine.length)rows.push({...base,'ردیف':'','تاریخ':'','اقدام انجام شده':'','واریزی':'','بدهی':''});
mine.forEach((v,i)=>rows.push({...base,'ردیف':i+1,'تاریخ':v.date_j,'اقدام انجام شده':v.descr,'واریزی':v.paid,'بدهی':v.debt}))});
const cols=['شماره پرونده','نام','تلفن','ردیف','تاریخ','اقدام انجام شده','واریزی','بدهی','نوبت بعدی'];
if(typeof XLSX!=='undefined'){const ws=XLSX.utils.json_to_sheet(rows,{header:cols});ws['!cols']=[10,18,14,6,12,34,12,12,18].map(w=>({wch:w}));const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'پرونده بیماران');wb.Workbook={Views:[{RTL:true}]};XLSX.writeFile(wb,'patients-files.xlsx')}
else{const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"',csv='\ufeff'+[cols.map(q).join(',')].concat(rows.map(r=>cols.map(c=>q(r[c])).join(','))).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='patients-files.csv';a.click()}}
</script></body></html>
